<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    
    <title>중첩 목록 만들기</title>
</head>
<body>
    <h1>순서가 없는 기본 목록</h1>
    <ul>
        <li>사과</li>
        <li>바나나</li>
        <li>수박</li>
    </ul>
    
    <h1>순서가 있는 기본 목록</h1>
    <ol>
        <li>사과</li>
        <li>바나나</li>
        <li>수박</li>
    </ol>

    <hr>
    <h1>중첩 목록</h1>
    <ul>

        <li>과일
            <ol>
                <li>사과</li>
                <li>바나나</li>
                <li>수박</li>
            </ol>
        </li>

        <li>채소
            <ol>
                <li>상추</li>
                <li>양배추</li>
                <li>양파</li>
            </ol>
        </li>

    </ul>
</body>
</html>
